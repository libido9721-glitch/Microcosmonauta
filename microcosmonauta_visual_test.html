<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#03090c">
<title>Microcosmonauta — Visual Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03090c;color:#eaf8f5;font-family:system-ui,-apple-system,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;z-index:2;left:16px;top:14px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.brand{font:11px monospace;letter-spacing:.15em}.sub{font:9px monospace;color:#90bcb7;margin-top:6px}.status{font:10px monospace;color:#bce9e2;text-align:right}
#bottom{position:absolute;z-index:2;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:end;gap:8px}
button{background:#0a1b20;color:#eafffb;border:1px solid #42686b;padding:11px 12px;font:10px monospace;letter-spacing:.06em;cursor:pointer;touch-action:manipulation}
button:active{background:#24494c}#controls{position:absolute;z-index:3;right:12px;top:50%;transform:translateY(-50%);width:174px;background:rgba(4,15,19,.94);border:1px solid #34575a;padding:12px}
#controls.hidden{display:none}.line{margin:10px 0;font:9px monospace;color:#c7e5e1}.line label{display:flex;justify-content:space-between;margin-bottom:7px}input{width:100%;accent-color:#a3eee4}
#note{font:10px monospace;color:#9ec3be;line-height:1.6;max-width:45%}
@media(max-width:600px){#controls{top:auto;bottom:65px;transform:none;max-height:48vh;overflow:auto;width:165px}button{padding:10px 9px}.brand{font-size:10px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div><div class="brand">MICROCOSMONAUTA</div><div class="sub">VISUAL CORE / TEST 004</div></div><div class="status" id="status">DRAWING ACTIVE</div></div>
<div id="controls">
<div style="font:10px monospace;letter-spacing:.1em;margin-bottom:12px">VISUAL CONTROL</div>
<div class="line"><label>FILAMENTOS <span id="nval">42</span></label><input id="n" type="range" min="12" max="90" value="42"></div>
<div class="line"><label>TENSIÓN <span id="fval">45</span></label><input id="f" type="range" min="0" max="100" value="45"></div>
<div class="line"><label>COLOR</label><input id="col" type="range" min="0" max="2" value="0"></div>
<button id="reset" style="width:100%;margin-top:4px">RESET VISUAL</button>
</div>
<div id="bottom"><div id="note">TOCA / CLICK: PULSO<br>ARRASTRA: DEFORMAR</div><div style="display:flex;gap:6px"><button id="pulse">PULSO ↗</button><button id="toggle">OCULTAR CONTROLES</button></div></div>
<script>
(function(){
 const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
 const status=document.getElementById('status');
 let w=0,h=0,dpr=1,t=0,filaments=42,tension=.45,palette=0,points=[],ripples=[],drag=null,px=.5,py=.5;
 const colors=[['#b7fff3','#60bdb8','#d8fff9'],['#b4d2ff','#6a94d4','#e0ecff'],['#e0c4ff','#a17acb','#f3e6ff']];
 function resize(){dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);points=Array.from({length:Math.max(160,Math.min(420,Math.floor(w*h/1800)))},()=>({a:Math.random()*Math.PI*2,r:.35+Math.random()*.9,s:.4+Math.random()*1.4,p:Math.random()*6.28}));}
 function pulse(x=w*.57,y=h*.51){ripples.push({x,y,r:2,a:1});if(ripples.length>14)ripples.shift();status.textContent='FIELD DISTURBED';setTimeout(()=>status.textContent='DRAWING ACTIVE',650)}
 function draw(now){t=now;const C=colors[palette];ctx.fillStyle='#03090c';ctx.fillRect(0,0,w,h);
 let bg=ctx.createRadialGradient(w*.57,h*.5,1,w*.57,h*.5,Math.max(w,h)*.68);bg.addColorStop(0,'rgba(27,72,76,.55)');bg.addColorStop(.6,'rgba(8,24,29,.22)');bg.addColorStop(1,'rgba(0,0,0,.1)');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 let cx=w*(.57+(px-.5)*.035),cy=h*(.51+(py-.5)*.035),s=Math.min(w,h)*.205*(.8+tension*.75);
 // Core glow and unmistakable central body
 let glow=ctx.createRadialGradient(cx,cy,1,cx,cy,s*2.2);glow.addColorStop(0,C[1]+'66');glow.addColorStop(.35,C[1]+'24');glow.addColorStop(1,C[1]+'00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,s*2.2,0,Math.PI*2);ctx.fill();
 let body=ctx.createRadialGradient(cx-s*.2,cy-s*.28,1,cx,cy,s);body.addColorStop(0,C[2]+'77');body.addColorStop(.45,C[0]+'24');body.addColorStop(1,C[1]+'00');ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(cx,cy,s*.52,s*.68,Math.sin(now*.0002)*.12,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=C[0]+'bb';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(cx,cy,s*.52,s*.68,Math.sin(now*.0002)*.12,0,Math.PI*2);ctx.stroke();
 for(let k=0;k<4;k++){ctx.beginPath();ctx.ellipse(cx,cy,s*(.16+k*.095),s*(.21+k*.12),now*.00005*(k+1),.2,Math.PI*1.8);ctx.strokeStyle=C[2]+(k===0?'99':'44');ctx.lineWidth=1;ctx.stroke()}
 // Filaments
 for(let i=0;i<filaments;i++){let a=i/filaments*Math.PI*2,phase=now*.0003+Math.sin(i*8.31)*2,len=s*(.85+tension*.85)*(0.8+.2*Math.sin(i*3.2));let sx=cx+Math.cos(a)*s*.3,sy=cy+Math.sin(a)*s*.42;ctx.beginPath();ctx.moveTo(sx,sy);for(let j=1;j<=26;j++){let q=j/26,bend=Math.sin(phase+i*.25+q*8)*s*(.03+tension*.11)*q;let x=sx+Math.cos(a)*len*q+Math.cos(a+Math.PI/2)*bend,y=sy+Math.sin(a)*len*q+Math.sin(a+Math.PI/2)*bend;if(j===1)ctx.lineTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=C[i%7===0?2:1]+(i%3===0?'bb':'77');ctx.lineWidth=i%5===0?1.3:.7;ctx.stroke();let ex=sx+Math.cos(a)*len,ey=sy+Math.sin(a)*len;ctx.fillStyle=C[0];ctx.beginPath();ctx.arc(ex,ey,1.2+(i%4===0?1:0),0,Math.PI*2);ctx.fill()}
 // Ambient particles
 points.forEach(p=>{let a=p.a+now*.00004,r=s*(.8+p.r*1.2),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;ctx.fillStyle=C[0]+(p.r>.8?'88':'44');ctx.beginPath();ctx.arc(x,y,p.s,0,Math.PI*2);ctx.fill()});
 ripples=ripples.filter(r=>r.a>0);ripples.forEach(r=>{ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.strokeStyle=C[2]+Math.floor(r.a*220).toString(16).padStart(2,'0');ctx.lineWidth=1.5;ctx.stroke();r.r+=3;r.a-=.018});
 requestAnimationFrame(draw)}
 canvas.addEventListener('pointerdown',e=>{px=e.clientX/w;py=e.clientY/h;drag={x:e.clientX,y:e.clientY};try{canvas.setPointerCapture(e.pointerId)}catch(err){}pulse(e.clientX,e.clientY)});
 canvas.addEventListener('pointermove',e=>{px=e.clientX/w;py=e.clientY/h;if(drag){let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};tension=Math.max(0,Math.min(1,tension+dx*.0015));document.getElementById('f').value=Math.round(tension*100);document.getElementById('fval').textContent=Math.round(tension*100)}});
 canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
 document.getElementById('pulse').onclick=()=>pulse();document.getElementById('toggle').onclick=()=>{let el=document.getElementById('controls');el.classList.toggle('hidden');document.getElementById('toggle').textContent=el.classList.contains('hidden')?'MOSTRAR CONTROLES':'OCULTAR CONTROLES'};
 document.getElementById('n').oninput=e=>{filaments=+e.target.value;document.getElementById('nval').textContent=filaments};document.getElementById('f').oninput=e=>{tension=+e.target.value/100;document.getElementById('fval').textContent=e.target.value};document.getElementById('col').oninput=e=>palette=+e.target.value;
 document.getElementById('reset').onclick=()=>{filaments=42;tension=.45;palette=0;document.getElementById('n').value=42;document.getElementById('nval').textContent=42;document.getElementById('f').value=45;document.getElementById('fval').textContent=45;document.getElementById('col').value=0;pulse()};
 window.addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script></body></html>
